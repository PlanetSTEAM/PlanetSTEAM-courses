<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Asistencia - Ingeniería de Software</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4472C4 0%, #366092 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .controls {
            padding: 25px;
            background: #f8f9fa;
            border-bottom: 2px solid #e0e0e0;
        }

        .search-container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: bold;
            font-size: 12px;
            color: #333;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #4472C4;
            box-shadow: 0 0 5px rgba(68, 114, 196, 0.3);
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            text-transform: uppercase;
        }

        .btn-primary {
            background: #4472C4;
            color: white;
        }

        .btn-primary:hover {
            background: #366092;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(68, 114, 196, 0.3);
        }

        .btn-secondary {
            background: #70AD47;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a9136;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(112, 173, 71, 0.3);
        }

        .btn-danger {
            background: #c00000;
            color: white;
        }

        .btn-danger:hover {
            background: #900000;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(192, 0, 0, 0.3);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 15px;
            text-align: center;
        }

        .stat-box {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #4472C4;
        }

        .stat-box h3 {
            font-size: 24px;
            color: #4472C4;
            margin-bottom: 5px;
        }

        .stat-box p {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
        }

        .table-container {
            overflow-x: auto;
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        thead {
            background: #f0f0f0;
            position: sticky;
            top: 0;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: bold;
            color: #333;
            border-bottom: 2px solid #4472C4;
            text-transform: uppercase;
            font-size: 11px;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        tbody tr:hover {
            background: #f9f9f9;
            transition: background 0.2s;
        }

        tbody tr.hidden {
            display: none;
        }

        .checkbox-cell input {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #4472C4;
        }

        .input-small {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 12px;
            width: 100%;
        }

        .input-small:focus {
            outline: none;
            border-color: #4472C4;
            box-shadow: 0 0 3px rgba(68, 114, 196, 0.3);
        }

        .group-badge {
            background: #4472C4;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            display: inline-block;
        }

        .present {
            background: #d4edda;
            color: #155724;
        }

        .footer {
            padding: 15px 20px;
            background: #f8f9fa;
            border-top: 1px solid #e0e0e0;
            font-size: 12px;
            color: #666;
            text-align: center;
        }

        @media (max-width: 768px) {
            .search-container {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            table {
                font-size: 11px;
            }

            th, td {
                padding: 8px 10px;
            }
        }
    </style>
</head>

            {nro: 124, name: "RONALD CASTRO RIVERA", email: "N00580574@upn.pe", group: 2},
            {nro: 125, name: "DIEGO ALONSO ALFARO ARCE", email: "N00580631@upn.pe", group: 3},
            {nro: 126, name: "EVELYN IRMA TORRES RIVERA", email: "N00580646@upn.pe", group: 32}
        ];

        // Cargar datos al iniciar
        window.addEventListener('load', function() {
            renderTable();
            updateStats();
            updateLastUpdate();
        });

        function renderTable() {
            const tbody = document.getElementById('studentTable');
            tbody.innerHTML = '';

            students.forEach(student => {
                const row = document.createElement('tr');
                const stored = getStudentData(student.nro);
                
                if (stored && stored.present) {
                    row.classList.add('present');
                }

                row.innerHTML = `
                    <td>${student.nro}</td>
                    <td><strong>${student.name}</strong></td>
                    <td style="font-size: 11px; color: #666;">${student.email}</td>
                    <td><span class="group-badge">Grupo ${student.group}</span></td>
                    <td class="checkbox-cell">
                        <input type="checkbox" ${stored && stored.present ? 'checked' : ''} onchange="updateStudent(${student.nro}, this.checked, document.getElementById('phone-${student.nro}').value)">
                    </td>
                    <td>
                        <input type="text" id="phone-${student.nro}" class="input-small" placeholder="Ej: 987654321" value="${stored && stored.phone ? stored.phone : ''}" onchange="updateStudent(${student.nro}, document.getElementById('checkbox-${student.nro}').checked, this.value)" onkeyup="updateStudent(${student.nro}, document.getElementById('checkbox-${student.nro}').checked, this.value)">
                    </td>
                `;

                // Agregar id al checkbox
                const checkbox = row.querySelector('input[type="checkbox"]');
                checkbox.id = `checkbox-${student.nro}`;

                tbody.appendChild(row);
            });
        }

        function updateStudent(nro, present, phone) {
            const data = {
                present: present,
                phone: phone
            };
            localStorage.setItem(`student_${nro}`, JSON.stringify(data));
            updateStats();
            updateLastUpdate();
            
            // Actualizar color de fila
            const rows = document.querySelectorAll('tbody tr');
            const index = students.findIndex(s => s.nro === nro);
            if (index >= 0) {
                if (present) {
                    rows[index].classList.add('present');
                } else {
                    rows[index].classList.remove('present');
                }
            }
        }

        function getStudentData(nro) {
            const data = localStorage.getItem(`student_${nro}`);
            return data ? JSON.parse(data) : null;
        }

        function updateStats() {
            let presentCount = 0;
            students.forEach(student => {
                const data = getStudentData(student.nro);
                if (data && data.present) {
                    presentCount++;
                }
            });

            const absentCount = students.length - presentCount;
            const percent = Math.round((presentCount / students.length) * 100);

            document.getElementById('presentCount').textContent = presentCount;
            document.getElementById('absentCount').textContent = absentCount;
            document.getElementById('attendancePercent').textContent = percent + '%';
        }

        function filterTable() {
            const searchName = document.getElementById('searchName').value.toUpperCase();
            const searchGroup = document.getElementById('searchGroup').value;
            const searchStatus = document.getElementById('searchStatus').value.toUpperCase();
            const rows = document.querySelectorAll('tbody tr');

            rows.forEach((row, index) => {
                const student = students[index];
                const data = getStudentData(student.nro);
                const present = data && data.present;
                let statusText = present ? 'PRESENTE' : 'AUSENTE';

                let show = true;

                if (searchName && !student.name.includes(searchName)) {
                    show = false;
                }

                if (searchGroup && parseInt(searchGroup) !== student.group) {
                    show = false;
                }

                if (searchStatus && !statusText.includes(searchStatus)) {
                    show = false;
                }

                row.classList.toggle('hidden', !show);
            });
        }

        function exportData() {
            let csv = 'Nro,Nombre,Correo,Grupo,Presente,Teléfono\n';
            
            students.forEach(student => {
                const data = getStudentData(student.nro);
                const present = data && data.present ? 'Sí' : 'No';
                const phone = data && data.phone ? data.phone : '-';
                csv += `${student.nro},"${student.name}",${student.email},${student.group},${present},${phone}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'asistencia_software.csv';
            a.click();
            window.URL.revokeObjectURL(url);
        }

        function clearData() {
            if (confirm('¿Estás seguro de que deseas limpiar toda la asistencia? Esta acción no se puede deshacer.')) {
                for (let i = 1; i <= students.length; i++) {
                    localStorage.removeItem(`student_${i}`);
                }
                renderTable();
                updateStats();
                updateLastUpdate();
            }
        }

        function updateLastUpdate() {
            const now = new Date();
            const time = now.toLocaleTimeString('es-PE');
            const date = now.toLocaleDateString('es-PE');
            document.getElementById('lastUpdate').textContent = `${date} a las ${time}`;
        }

        // Permitir búsqueda en tiempo real
        document.getElementById('searchName').addEventListener('input', filterTable);
        document.getElementById('searchGroup').addEventListener('input', filterTable);
        document.getElementById('searchStatus').addEventListener('input', filterTable);
    </script>
</body>
</html>
